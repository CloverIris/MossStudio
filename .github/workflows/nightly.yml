name: Nightly

# Builds main every night (and on demand) for every platform and replaces the rolling `nightly`
# GitHub prerelease with its setups and portable packages. A nightly is download-only: it is on
# no update feed, needs no signing key and never enters the `release` environment.
#
# Version: <next release>-nightly.<UTC date>, e.g. 1.0.3-nightly.20261108. It ranks below the
# release it leads up to, so that release replaces it. The scheduled run skips a night when main
# has not moved since the last nightly; a manual run always builds.
on:
  schedule:
    - cron: '0 18 * * *' # 02:00 Beijing time
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Decide version and whether to build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build: ${{ steps.version.outputs.build }}
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - id: version
        name: Version from package.json and the date
        env:
          EVENT: ${{ github.event_name }}
        run: |
          sha=$(git rev-parse HEAD)
          last=$(git ls-remote origin refs/tags/nightly | cut -f1)
          if [ "$EVENT" = schedule ] && [ "$sha" = "$last" ]; then
            echo "main is still at the last nightly ($sha); nothing to build"
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The next release: package.json, or one patch later when that version already shipped.
          version=$(node --no-warnings --input-type=module -e '
            import { execFileSync } from "node:child_process"
            import { readFileSync } from "node:fs"
            import { parseVersion } from "./tools/release/lib/version.mjs"
            const v = parseVersion(JSON.parse(readFileSync("apps/desktop/package.json", "utf8")).version)
            let core = `${v.major}.${v.minor}.${v.patch}`
            const tags = execFileSync("git", ["tag", "--list"], { encoding: "utf8" }).split("\n")
            if (tags.includes(core) || tags.includes(`v${core}`)) core = `${v.major}.${v.minor}.${v.patch + 1}`
            console.log(`${core}-nightly.${process.argv[1]}`)
          ' "$(date -u +%Y%m%d)")
          echo "nightly $version from $sha"
          echo "build=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - { runner: windows-latest, platform: win32-x64 }
          - { runner: ubuntu-latest, platform: linux-x64 }
          - { runner: macos-latest, platform: darwin-arm64 }
          - { runner: macos-15-intel, platform: darwin-x64 }
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: ${{ !startsWith(matrix.platform, 'darwin') }}
        with:
          go-version-file: apps/launcher/go.mod
          cache-dependency-path: apps/launcher/go.mod
      - run: pnpm install --frozen-lockfile
      # No typecheck here: CI already checks every commit on main.
      - id: electron
        name: Electron version
        run: echo "version=$(node -p 'require("./apps/desktop/node_modules/electron/package.json").version')" >> "$GITHUB_OUTPUT"
      # Packaging downloads the Electron zip for the platform; @electron/get keeps it in the OS cache folder.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ steps.electron.outputs.version }}-${{ matrix.platform }}
      - name: Release build (no test keys, real feed)
        run: pnpm build
        env:
          MOSS_UPDATE_TEST_KEYS: ''
          MOSS_UPDATE_FEED_URL: ''
      - name: Launcher
        if: ${{ !startsWith(matrix.platform, 'darwin') }}
        working-directory: apps/launcher
        run: bash build.sh
      - name: Package as ${{ env.VERSION }}
        run: pnpm release:package --platform ${{ matrix.platform }} --version "$VERSION"
      - name: Setup and portable package
        run: pnpm release:artifacts --platform ${{ matrix.platform }} --version "$VERSION"
      - name: Verify
        run: pnpm release:verify --version "$VERSION" --platform ${{ matrix.platform }} --no-feeds
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-${{ matrix.platform }}
          # Downloads only: the full package and file list exist for updates, which nightlies are not part of.
          path: |
            dist/release/artifacts/MossStudio-Setup-*
            dist/release/artifacts/MossStudio-*-portable.*
            dist/release/artifacts/MossStudio-*.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  publish:
    name: Replace the nightly release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      SHA: ${{ needs.prepare.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nightly-*
          path: nightly
          merge-multiple: true
      - name: Notes
        run: |
          cat > notes.md <<EOF
          每日构建 **$VERSION**，来自 \`main\` 的 [\`${SHA::7}\`](https://github.com/$GH_REPO/commit/$SHA)。

          - 每晚自动更新，只保留最新一版。
          - 未经发布前的完整测试，可能不稳定。日常使用请下载[正式版](https://github.com/$GH_REPO/releases/latest)。
          - 不会通过应用内更新推送给任何人，只能在这里手动下载。
          - 安装包未做系统签名，首次打开时系统可能会提示。
          EOF
      - name: Replace release `nightly`
        run: |
          # Delete first so the tag moves to the new commit and no old file lingers.
          if gh release view nightly >/dev/null 2>&1; then gh release delete nightly --cleanup-tag --yes; fi
          git ls-remote --exit-code "https://github.com/$GH_REPO" refs/tags/nightly >/dev/null 2>&1 && gh api -X DELETE "repos/$GH_REPO/git/refs/tags/nightly"
          gh release create nightly nightly/* --target "$SHA" --title "MossStudio $VERSION（每日构建）" --notes-file notes.md --prerelease --latest=false
