name: Build

# Tiers (decided by .github/scripts/ci-scope.sh):
#   every pull request    typecheck, unit, launcher (Go) and E2E tests (`checks`)
#   + install/update      the package + install/update/rollback matrix, without macOS Intel,
#     paths changed       when the PR touches what it tests (launcher, install, update, release)
#   merge queue           the same as the pull request, on the PR merged onto the queue ahead of it
#   push to main, manual  everything on all four platforms
# Run the full matrix for a pull request by hand: `gh workflow run build.yml --ref <branch>`.
# `CI result` is the one check to require: it passes when every job that ran passed.
#
# Every package built here is a TEST build: it trusts an ephemeral key generated in the job
# and reads its update feed from a local server, so it can never update from the real feed.
on:
  pull_request:
  # The merge queue on main tests each PR on top of the ones ahead of it before merging.
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # One run per pull request (or branch): a new push cancels the previous PR run; main keeps
  # every commit's run.
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scope:
    name: Decide what to run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      install: ${{ steps.scope.outputs.install }}
      matrix: ${{ steps.scope.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: scope
        run: bash .github/scripts/ci-scope.sh
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}

  checks:
    name: Typecheck, unit tests, launcher tests, E2E (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      E2E_SHOTS_DIR: ${{ github.workspace }}/e2e-shots
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/launcher/go.mod
          cache-dependency-path: apps/launcher/go.mod
      - name: Install system packages for Electron under a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libgbm1 libasound2t64 libgtk-3-0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Lint (ESLint; bug-finding rules, see eslint.config.mjs)
        run: pnpm lint
      - name: Formatting (Prettier)
        run: pnpm format:check
      - run: pnpm test:unit
      - name: Launcher tests (go test)
        working-directory: apps/launcher
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "::error::not gofmt-formatted:"; echo "$unformatted"; exit 1; fi
          go vet ./...
          go test ./...
          GOOS=windows GOARCH=amd64 go vet ./...
      - run: pnpm build
      - name: End-to-end tests (mock backend, Electron)
        run: pnpm test:e2e
      - name: In-app scenarios (built app)
        run: pnpm --filter @clover/desktop test:scenarios
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: e2e-shots
          if-no-files-found: ignore

  package:
    name: Package and install/update/rollback test (${{ matrix.platform }})
    needs: scope
    if: needs.scope.outputs.install == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      # win32-x64, linux-x64, darwin-arm64, and darwin-x64 (macos-15-intel, the last hosted
      # Intel image) on main and manual runs only; see ci-scope.sh.
      matrix:
        include: ${{ fromJSON(needs.scope.outputs.matrix) }}
    env:
      # Must match MOSS_IT_PORT of the test server (tools/release/integration/server.mjs).
      MOSS_IT_PORT: '47613'
      IT_REPORT: ${{ github.workspace }}/it-report
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v7
        if: ${{ !startsWith(matrix.platform, 'darwin') }}
        with:
          go-version-file: apps/launcher/go.mod
          cache-dependency-path: apps/launcher/go.mod
      - name: Install system packages for Electron under a virtual display
        if: matrix.platform == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libgbm1 libasound2t64 libgtk-3-0
      - run: pnpm install --frozen-lockfile

      - name: Ephemeral test signing key
        run: |
          node tools/release/keygen.mjs --json > "$RUNNER_TEMP/it-key.json"
          node -e '
            const fs = require("fs")
            const k = JSON.parse(fs.readFileSync(process.argv[1], "utf8"))
            fs.writeFileSync(process.argv[2], k.privateKey)
            console.log("::add-mask::" + k.privateKey)
            fs.appendFileSync(process.env.GITHUB_ENV, "MOSS_UPDATE_TEST_KEYS=" + JSON.stringify([{ id: k.id, publicKey: k.publicKey }]) + "\n")
          ' "$RUNNER_TEMP/it-key.json" "$RUNNER_TEMP/it-key.txt"
          rm "$RUNNER_TEMP/it-key.json"
          echo "MOSS_IT_KEY_FILE=$RUNNER_TEMP/it-key.txt" >> "$GITHUB_ENV"
          echo "APP_VERSION=$(node -p 'require("./apps/desktop/package.json").version')" >> "$GITHUB_ENV"

      - name: Test build (trusts the test key, feed on 127.0.0.1)
        run: pnpm build
        env:
          MOSS_UPDATE_FEED_URL: http://127.0.0.1:${{ env.MOSS_IT_PORT }}/feed/

      - name: Launcher
        if: ${{ !startsWith(matrix.platform, 'darwin') }}
        working-directory: apps/launcher
        run: bash build.sh

      - name: Package X, X+1, X+2 and build their setup, portable, full, delta and feed files
        run: pnpm test:install:prepare --platform ${{ matrix.platform }} --key-file "$MOSS_IT_KEY_FILE"

      - name: Install → update → rollback → uninstall (xvfb)
        if: matrix.platform == 'linux-x64'
        run: xvfb-run -a -s '-screen 0 1600x1000x24' node tools/release/integration/run.mjs --platform ${{ matrix.platform }} --report "$IT_REPORT"

      - name: Install → update → rollback → uninstall
        if: matrix.platform != 'linux-x64'
        run: node tools/release/integration/run.mjs --platform ${{ matrix.platform }} --report "$IT_REPORT"

      - name: Upload the test-build artifacts of ${{ env.APP_VERSION }}
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MossStudio-test-build-${{ matrix.platform }}
          path: |
            dist/it/${{ matrix.platform }}/artifacts/MossStudio-Setup-${{ env.APP_VERSION }}-*
            dist/it/${{ matrix.platform }}/artifacts/MossStudio-${{ env.APP_VERSION }}-*
            dist/it/${{ matrix.platform }}/artifacts/files-${{ env.APP_VERSION }}-*
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7

      - name: Upload the integration report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: install-test-report-${{ matrix.platform }}
          path: ${{ env.IT_REPORT }}
          if-no-files-found: ignore

  result:
    name: CI result
    if: always()
    needs: [scope, checks, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job that ran passed
        env:
          RESULTS: ${{ needs.scope.result }} ${{ needs.checks.result }} ${{ needs.package.result }}
          INSTALL: ${{ needs.scope.outputs.install }}
        run: |
          echo "scope checks package: $RESULTS (package matrix: ${INSTALL:-?})"
          read -r scope checks package <<< "$RESULTS"
          [[ "$scope" == success && "$checks" == success ]] || { echo "::error::scope or checks did not pass"; exit 1; }
          case "$package" in
            success) ;;
            skipped) [[ "$INSTALL" == false ]] || { echo "::error::the package matrix was skipped although it was needed"; exit 1; } ;;
            *) echo "::error::the package matrix ended: $package"; exit 1 ;;
          esac
