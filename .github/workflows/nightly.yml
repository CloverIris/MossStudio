name: Nightly

# Builds main every night (and on demand) for every platform and replaces the rolling `nightly`
# GitHub prerelease with its setups and portable packages. With a nightly key (the `nightly`
# environment, see docs/how-to/release.md) it also signs update-nightly.json, which clients on
# 每日构建 follow, and puts the update packages next to it on the `updates` release. The production
# key and the `release` environment are never used here.
#
# Version: <next release>-nightly.<UTC date>.<run>, e.g. 1.0.3-nightly.20261108.42 (nightlyVersion in
# tools/release/lib/version.mjs). It ranks below the release it leads up to, so that release replaces
# it. The scheduled run skips a night when main has not moved since the last nightly; a manual run
# always builds.
on:
  schedule:
    - cron: '0 18 * * *' # 02:00 Beijing time
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Decide version and whether to build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build: ${{ steps.version.outputs.build }}
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
      last: ${{ steps.version.outputs.last }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - id: version
        name: Version from package.json and the date
        env:
          EVENT: ${{ github.event_name }}
          RUN: ${{ github.run_number }}
        run: |
          sha=$(git rev-parse HEAD)
          last=$(git ls-remote origin refs/tags/nightly | cut -f1)
          if [ "$EVENT" = schedule ] && [ "$sha" = "$last" ]; then
            echo "main is still at the last nightly ($sha); nothing to build"
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(node --no-warnings --input-type=module -e '
            import { execFileSync } from "node:child_process"
            import { readFileSync } from "node:fs"
            import { nightlyVersion } from "./tools/release/lib/version.mjs"
            const tags = execFileSync("git", ["tag", "--list"], { encoding: "utf8" }).split("\n")
            const pkg = JSON.parse(readFileSync("apps/desktop/package.json", "utf8")).version
            console.log(nightlyVersion(pkg, tags, new Date(), Number(process.argv[1])))
          ' "$RUN")
          echo "nightly $version from $sha"
          echo "build=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "last=$last" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - { runner: windows-latest, platform: win32-x64 }
          - { runner: ubuntu-latest, platform: linux-x64 }
          - { runner: macos-latest, platform: darwin-arm64 }
          - { runner: macos-15-intel, platform: darwin-x64 }
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: ${{ !startsWith(matrix.platform, 'darwin') }}
        with:
          go-version-file: apps/launcher/go.mod
          cache-dependency-path: apps/launcher/go.mod
      - run: pnpm install --frozen-lockfile
      # No typecheck here: CI already checks every commit on main.
      - id: electron
        name: Electron version
        run: echo "version=$(node -p 'require("./apps/desktop/node_modules/electron/package.json").version')" >> "$GITHUB_OUTPUT"
      # Packaging downloads the Electron zip for the platform; @electron/get keeps it in the OS cache folder.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ steps.electron.outputs.version }}-${{ matrix.platform }}
      - name: Release build (no test keys, real feed)
        run: pnpm build
        env:
          MOSS_UPDATE_TEST_KEYS: ''
          MOSS_UPDATE_FEED_URL: ''
      - name: Launcher
        if: ${{ !startsWith(matrix.platform, 'darwin') }}
        working-directory: apps/launcher
        run: bash build.sh
      - name: Package as ${{ env.VERSION }}
        run: pnpm release:package --platform ${{ matrix.platform }} --version "$VERSION"
      - name: Setup and portable package
        run: pnpm release:artifacts --platform ${{ matrix.platform }} --version "$VERSION"
      - name: Verify
        run: pnpm release:verify --version "$VERSION" --platform ${{ matrix.platform }} --no-feeds
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-${{ matrix.platform }}
          # Setups and portable packages for the `nightly` release; full packages and file lists for updates.
          path: |
            dist/release/artifacts/MossStudio-*
            dist/release/artifacts/files-*
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  publish:
    name: Update feed and the nightly release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Holds MOSS_NIGHTLY_SIGNING_KEY. Limit the environment to `main`; it needs no reviewer, because
    # clients trust its key for update-nightly.json only (NIGHTLY_UPDATE_KEYS).
    environment: nightly
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      SHA: ${{ needs.prepare.outputs.sha }}
      LAST: ${{ needs.prepare.outputs.last }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ART: dist/release/artifacts
      PREV: dist/release/previous
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install the runtime packages the checks use (yauzl, zod)
        run: pnpm install --frozen-lockfile --prod --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nightly-*
          path: dist/release/artifacts
          merge-multiple: true
      - name: Notes
        run: |
          # The commits since the last nightly, when it is an ancestor (a force-push can drop it).
          subjects=()
          if [ -n "$LAST" ] && git merge-base --is-ancestor "$LAST" "$SHA" 2>/dev/null; then
            mapfile -t subjects < <(git log --no-merges --format=%s "$LAST..$SHA")
          fi
          node --input-type=module -e '
            import { nightlyNotes } from "./tools/release/lib/feed.mjs"
            const [sha, repo, ...subjects] = process.argv.slice(1)
            console.log(nightlyNotes({ sha, repo, subjects }))
          ' "$SHA" "$GH_REPO" "${subjects[@]}" > feed-notes.md
          cat > notes.md <<EOF
          每日构建 **$VERSION**，来自 \`main\` 的 [\`${SHA::7}\`](https://github.com/$GH_REPO/commit/$SHA)。

          - 每晚自动更新，只保留最新一版。
          - 未经发布前的完整测试，可能不稳定。日常使用请下载[正式版](https://github.com/$GH_REPO/releases/latest)。
          - 已安装的 MossStudio 在「设置 › 通知与更新」把更新渠道选为「每日构建」后，会每晚自动更新到这里的新版本。
          - 安装包未做系统签名，首次打开时系统可能会提示。
          EOF
      - name: Feed (only with a nightly key)
        id: feed
        env:
          MOSS_UPDATE_SIGNING_KEY: ${{ secrets.MOSS_NIGHTLY_SIGNING_KEY }}
        run: |
          if [ -z "$MOSS_UPDATE_SIGNING_KEY" ]; then
            echo "::notice::No MOSS_NIGHTLY_SIGNING_KEY in the nightly environment: this nightly is download-only."
            echo "feed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node --no-warnings tools/release/fetch-nightly.mjs --out "$PREV"
          node tools/release/make-deltas.mjs --version "$VERSION" --previous "$PREV" --artifacts "$ART"
          node tools/release/make-feed.mjs --nightly --version "$VERSION" --artifacts "$ART" --notes-file feed-notes.md --current-nightly "$PREV/current-update-nightly.json"
          if [ ! -f "$ART/update-nightly.json" ]; then echo "feed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          node tools/release/sign-feed.mjs "$ART/update-nightly.json"
          # Fails unless the key's public half is in NIGHTLY_UPDATE_KEYS, so clients will accept the feed.
          node --no-warnings tools/release/verify-artifacts.mjs --version "$VERSION" --artifacts "$ART" --previous "$PREV" --nightly-keys
          echo "feed=true" >> "$GITHUB_OUTPUT"
      - name: Update packages and the feed on the rolling `updates` release
        if: steps.feed.outputs.feed == 'true'
        run: |
          if ! gh release view updates >/dev/null 2>&1; then
            gh release create updates --title "Update feeds" --notes "Signed update feeds (update-<channel>.json + .sig) read by MossStudio, and the latest nightly's update packages. Replaced by every release and nightly; not a download." --prerelease --latest=false --target "$SHA"
          fi
          shopt -s nullglob
          packages=("$ART"/MossStudio-"$VERSION"-*-full.zip "$ART"/files-"$VERSION"-*.json "$ART"/MossStudio-*-to-"$VERSION"-*.delta.zip)
          gh release upload updates "${packages[@]}" --clobber
          # The signature first: a client that reads the new .sig with the old feed fails the
          # check and retries later; it never trusts anything unverified.
          gh release upload updates "$ART/update-nightly.json.sig" --clobber
          gh release upload updates "$ART/update-nightly.json" --clobber
          # Only now that the feed names the new packages: drop older nightlies' ones, keeping the
          # previous nightly's so a download that started from the old feed can finish.
          previous=""
          if [ -f "$PREV/current-update-nightly.json" ]; then
            previous=$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).version' "$PREV/current-update-nightly.json")
          fi
          gh release view updates --json assets -q '.assets[].name' > updates-assets.txt
          node --input-type=module -e '
            import { readFileSync } from "node:fs"
            import { staleNightlyPackages } from "./tools/release/lib/version.mjs"
            const names = readFileSync("updates-assets.txt", "utf8").split("\n").filter(Boolean)
            for (const name of staleNightlyPackages(names, process.argv.slice(1))) console.log(name)
          ' "$VERSION" "$previous" > stale.txt
          while read -r name; do gh release delete-asset updates "$name" --yes; done < stale.txt
      - name: Replace release `nightly`
        run: |
          # Delete first so the tag moves to the new commit and no old file lingers.
          if gh release view nightly >/dev/null 2>&1; then gh release delete nightly --cleanup-tag --yes; fi
          git ls-remote --exit-code "https://github.com/$GH_REPO" refs/tags/nightly >/dev/null 2>&1 && gh api -X DELETE "repos/$GH_REPO/git/refs/tags/nightly"
          shopt -s nullglob
          downloads=("$ART"/MossStudio-Setup-* "$ART"/MossStudio-*-portable.* "$ART"/MossStudio-*.dmg)
          gh release create nightly "${downloads[@]}" --target "$SHA" --title "MossStudio $VERSION（每日构建）" --notes-file notes.md --prerelease --latest=false
