name: Release

# Pushing a tag v<version> (matching package.json) builds every platform, signs the update
# feeds with MOSS_UPDATE_SIGNING_KEY, publishes release v<version> and replaces the feeds on
# the rolling `updates` release. Without the secret (or a production public key in
# apps/desktop/src/shared/updateKeys.ts that matches it) nothing is built or published.
# The secret lives in the protected `release` environment; only the jobs that need it (and
# only for a tag whose commit is on main) enter that environment. Third-party actions are
# pinned to commit SHAs.
on:
  push:
    tags: ['v*']

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Check tag, version, notes and signing key
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Tagged commit is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag ${GITHUB_REF_NAME} points at $GITHUB_SHA, which is not on main; refusing to release"
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - id: version
        name: Tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          root=$(node -p 'require("./package.json").version')
          desktop=$(node -p 'require("./apps/desktop/package.json").version')
          if [ "$TAG" != "v$desktop" ] || [ "$root" != "$desktop" ]; then
            echo "::error::tag $TAG does not match package.json (root $root, apps/desktop $desktop)"
            exit 1
          fi
          case "$desktop" in *-*) pre=true ;; *) pre=false ;; esac
          echo "version=$desktop" >> "$GITHUB_OUTPUT"
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"
          test -f "release/notes/$desktop.md" || { echo "::error::release/notes/$desktop.md is missing"; exit 1; }
      - name: Signing key present and trusted by the app
        env:
          MOSS_UPDATE_SIGNING_KEY: ${{ secrets.MOSS_UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$MOSS_UPDATE_SIGNING_KEY" ]; then
            echo "::error::secret MOSS_UPDATE_SIGNING_KEY is not set; refusing to release (pnpm release:keygen makes one)"
            exit 1
          fi
          node --no-warnings --input-type=module -e '
            import { loadProductionKeys } from "./tools/release/lib/contract.mjs"
            import { parsePrivateKey, publicKeyBase64 } from "./tools/release/lib/sign.mjs"
            const pub = publicKeyBase64(parsePrivateKey(process.env.MOSS_UPDATE_SIGNING_KEY))
            const keys = await loadProductionKeys()
            if (!keys.some((k) => k.publicKey === pub)) {
              console.error("::error::the signing key public half is not in PRODUCTION_UPDATE_KEYS (apps/desktop/src/shared/updateKeys.ts)")
              process.exit(1)
            }
          '

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - { runner: windows-latest, platform: win32-x64 }
          - { runner: ubuntu-latest, platform: linux-x64 }
          - { runner: macos-latest, platform: darwin-arm64 }
          - { runner: macos-15-intel, platform: darwin-x64 }
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        if: ${{ !startsWith(matrix.platform, 'darwin') }}
        with:
          go-version-file: apps/launcher/go.mod
          cache-dependency-path: apps/launcher/go.mod
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Release build (no test keys, real feed)
        run: pnpm build
        env:
          # Release builds define __MOSS_UPDATE_TEST_KEYS__ as [] and use the real feed URL.
          MOSS_UPDATE_TEST_KEYS: ''
          MOSS_UPDATE_FEED_URL: ''
      - name: Launcher
        if: ${{ !startsWith(matrix.platform, 'darwin') }}
        working-directory: apps/launcher
        run: bash build.sh
      - name: Package
        run: pnpm release:package --platform ${{ matrix.platform }}
      - name: Setup, portable, full package and file list
        run: pnpm release:artifacts --platform ${{ matrix.platform }} --version "$VERSION"
      - name: Verify
        run: pnpm release:verify --version "$VERSION" --platform ${{ matrix.platform }} --no-feeds
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.platform }}
          path: |
            dist/release/artifacts/MossStudio-*
            dist/release/artifacts/files-*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Deltas, feeds, signatures, GitHub releases
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      ART: dist/release/artifacts
      PREV: dist/release/previous
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install the runtime packages the checks use (yauzl, zod)
        run: pnpm install --frozen-lockfile --prod --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: dist/release/artifacts
          merge-multiple: true
      - name: File lists of earlier releases and the current (verified) feeds
        run: node --no-warnings tools/release/fetch-previous.mjs --version "$VERSION" --out "$PREV"
      - name: Delta packages
        run: node tools/release/make-deltas.mjs --version "$VERSION" --previous "$PREV" --artifacts "$ART"
      - name: Feeds
        run: node tools/release/make-feed.mjs --version "$VERSION" --artifacts "$ART" --require-notes --current-stable "$PREV/current-update-stable.json" --current-beta "$PREV/current-update-beta.json"
      - name: Sign feeds
        env:
          MOSS_UPDATE_SIGNING_KEY: ${{ secrets.MOSS_UPDATE_SIGNING_KEY }}
        run: |
          shopt -s nullglob
          feeds=("$ART"/update-*.json)
          if [ ${#feeds[@]} -eq 0 ]; then echo "no feed to sign: every channel already carries a newer or equal version"; exit 0; fi
          node tools/release/sign-feed.mjs "${feeds[@]}"
      - name: Verify everything against the production keys
        run: node --no-warnings tools/release/verify-artifacts.mjs --version "$VERSION" --artifacts "$ART" --previous "$PREV" --production-keys --feeds-optional
      - name: Create release v${{ env.VERSION }}
        run: |
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          shopt -s nullglob
          files=("$ART"/MossStudio-* "$ART"/files-*)
          gh release create "v$VERSION" "${files[@]}" --verify-tag --title "MossStudio $VERSION" --notes-file "release/notes/$VERSION.md" "${flags[@]}"
      - name: Replace the feeds on the rolling `updates` release
        run: |
          if ! gh release view updates >/dev/null 2>&1; then
            gh release create updates --title "Update feeds" --notes "Signed update feeds (update-<channel>.json + .sig) read by MossStudio. Replaced by every release; not a download." --prerelease --latest=false --target "$GITHUB_SHA"
          fi
          shopt -s nullglob
          # The signature first: a client that reads the new .sig with the old feed fails the
          # check and retries later; it never trusts anything unverified.
          for feed in "$ART"/update-*.json; do
            gh release upload updates "$feed.sig" --clobber
            gh release upload updates "$feed" --clobber
          done
